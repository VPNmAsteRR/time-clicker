<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Time Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f1016);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #707579);
            --button-color: var(--tg-theme-button-color, #4facfe);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #1a1c24);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Основной контейнер экранов */
        .app-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 90px;
        }

        .screen {
            display: none;
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Шапка */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .balance-card {
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.1), rgba(0, 242, 254, 0.05));
            border: 1px solid rgba(79, 172, 254, 0.3);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 0 25px rgba(79, 172, 254, 0.15);
            backdrop-filter: blur(10px);
            margin-bottom: 25px;
        }

        .balance-title {
            font-size: 14px;
            color: var(--hint-color);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-value {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Кликер элемент */
        .clicker-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 40px rgba(79, 172, 254, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.4);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            position: relative;
            margin: 20px 0;
        }

        .clicker-circle:active {
            transform: scale(0.92);
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.6);
        }

        .clicker-circle span {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        /* Анимация летящих цифр при клике */
        .floating-number {
            position: absolute;
            font-size: 20px;
            font-weight: bold;
            color: #00f2fe;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
        }

        /* Карточки в магазине и профиле */
        .shop-list, .profile-list {
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card-item {
            background: var(--secondary-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .card-item:hover {
            border-color: rgba(79, 172, 254, 0.4);
            transform: translateY(-2px);
        }

        .card-info h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .card-info p {
            font-size: 13px;
            color: var(--hint-color);
        }

        .action-btn {
            background: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(79, 172, 254, 0.3);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn:disabled {
            background: var(--hint-color);
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Нижняя навигация */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background: rgba(26, 28, 36, 0.85);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--hint-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: color 0.2s ease;
            flex: 1;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
            transition: transform 0.2s ease;
        }

        .nav-item.active {
            color: #4facfe;
        }

        .nav-item.active svg {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="screen-clicker" class="screen active">
            <div class="header">
                <h1 style="font-size: 22px; margin-bottom: 5px;">Time Clicker</h1>
                <p style="color: var(--hint-color); font-size: 13px;">Тапай, копи секунды и забирай VPN</p>
            </div>

            <div class="balance-card">
                <div class="balance-title">Твой баланс</div>
                <div class="balance-value" id="seconds-count">0.0</div>
                <div style="font-size: 12px; color: var(--hint-color); margin-top: 5px;">секунд накопилось</div>
            </div>

            <div class="clicker-circle" id="clicker-btn">
                <span>⚡ ТАП</span>
            </div>
        </div>

        <div id="screen-shop" class="screen">
            <div class="header">
                <h1 style="font-size: 22px; margin-bottom: 5px;">Магазин VPN</h1>
                <p style="color: var(--hint-color); font-size: 13px;">Обменивай секунды на подписку</p>
            </div>

            <div class="shop-list">
                <div class="card-item">
                    <div class="card-info">
                        <h3>1 день VPN</h3>
                        <p>Стоимость: 300 сек</p>
                    </div>
                    <button class="action-btn" onclick="buyItem(300, 'VPN-1DAY-XXXX')">Взять</button>
                </div>
                <div class="card-item">
                    <div class="card-info">
                        <h3>7 дней VPN</h3>
                        <p>Стоимость: 1800 сек</p>
                    </div>
                    <button class="action-btn" onclick="buyItem(1800, 'VPN-7DAYS-YYYY')">Взять</button>
                </div>
                <div class="card-item">
                    <div class="card-info">
                        <h3>30 дней VPN</h3>
                        <p>Стоимость: 7000 сек</p>
                    </div>
                    <button class="action-btn" onclick="buyItem(7000, 'VPN-30DAYS-ZZZZ')">Взять</button>
                </div>
            </div>
        </div>

        <div id="screen-profile" class="screen">
            <div class="header">
                <h1 style="font-size: 22px; margin-bottom: 5px;">Профиль</h1>
                <p style="color: var(--hint-color); font-size: 13px;" id="user-name">Игрок</p>
            </div>

            <div class="profile-list">
                <div class="card-item" style="flex-direction: column; align-items: flex-start; gap: 8px;">
                    <span style="font-size: 13px; color: var(--hint-color);">Твои купленные промокоды:</span>
                    <div id="promo-history" style="font-size: 14px; font-weight: 500; color: #4facfe;">Пока пусто</div>
                </div>
            </div>
        </div>
    </div>

    <nav class="nav-bar">
        <button class="nav-item active" onclick="switchScreen('clicker', this)">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.03-.42 1.98-1.07 2.75z"/></svg>
            Кликер
        </button>
        <button class="nav-item" onclick="switchScreen('shop', this)">
            <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
            Магазин
        </button>
        <button class="nav-item" onclick="switchScreen('profile', this)">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Профиль
        </button>
    </nav>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Данные игры
        let seconds = parseFloat(localStorage.getItem('tc_seconds')) || 0.0;
        let promos = JSON.parse(localStorage.getItem('tc_promos')) || [];

        const secondsCountEl = document.getElementById('seconds-count');
        const clickerBtn = document.getElementById('clicker-btn');
        const promoHistoryEl = document.getElementById('promo-history');
        const userNameEl = document.getElementById('user-name');

        // Имя пользователя из Телеграма
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userNameEl.textContent = `@${tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name}`;
        }

        updateUI();

        // Клик по кнопке
        clickerBtn.addEventListener('click', (e) => {
            seconds += 1.0;
            saveData();
            updateUI();

            // Вибрация (если поддерживается)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            // Анимация всплывающей циферки
            const rect = clickerBtn.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const num = document.createElement('div');
            num.className = 'floating-number';
            num.textContent = '+1';
            num.style.left = `${x}px`;
            num.style.top = `${y}px`;
            clickerBtn.appendChild(num);

            setTimeout(() => num.remove(), 800);
        });

        // Покупка товара
        function buyItem(cost, promoCode) {
            if (seconds >= cost) {
                seconds -= cost;
                promos.push(promoCode);
                saveData();
                updateUI();
                
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
                alert(`Успешно! Ваш промокод: ${promoCode}`);
            } else {
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('error');
                }
                alert('Не хватает секунд на балансе!');
            }
        }

        // Обновление интерфейса
        function updateUI() {
            secondsCountEl.textContent = seconds.toFixed(1);
            
            if (promos.length > 0) {
                promoHistoryEl.innerHTML = promos.map(p => `<div>🎁 ${p}</div>`).join('');
            } else {
                promoHistoryEl.innerHTML = 'Пока пусто';
            }
        }

        // Сохранение в память телефона
        function saveData() {
            localStorage.setItem('tc_seconds', seconds);
            localStorage.setItem('tc_promos', JSON.stringify(promos));
        }

        // Переключение экранов
        function switchScreen(screenName, element) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            document.getElementById(`screen-${screenName}`).classList.add('active');
            element.classList.add('active');

            if (tg.HapticFeedback) {
                tg.HapticFeedback.selectionChanged();
            }
        }
    </script>
</body>
</html>
