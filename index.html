<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Time Clicker & VPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1b143f 0%, #090618 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Шапка профиля */
        .header-bar {
            width: 100%;
            padding: 15px 20px 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .profile-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff007f, #7928ca);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .username {
            font-size: 14px;
            font-weight: 600;
        }

        /* Контент вкладок */
        .tab-content {
            display: none;
            flex: 1;
            width: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            overflow-y: auto;
        }

        .tab-content.active {
            display: flex;
        }

        /* Кликер */
        .score-container {
            font-size: 52px;
            font-weight: 900;
            color: #00ffcc;
            text-shadow: 0 0 25px rgba(0, 255, 204, 0.5);
            margin-bottom: 5px;
        }

        .score-label {
            font-size: 12px;
            color: #8c7ae6;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
        }

        .clicker-area {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .tap-button {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, #7928ca 0%, #4300b0 100%);
            border: 4px solid rgba(0, 255, 204, 0.4);
            box-shadow: 0 0 40px rgba(121, 40, 202, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 34px;
            font-weight: 900;
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            outline: none;
        }

        .tap-button:active {
            transform: scale(0.92);
            box-shadow: 0 0 20px rgba(121, 40, 202, 0.8);
        }

        .floating-text {
            position: absolute;
            color: #00ffcc;
            font-weight: bold;
            font-size: 20px;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.8);
            animation: floatUp 0.7s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
        }

        .withdraw-btn {
            width: 100%;
            max-width: 280px;
            padding: 12px;
            border-radius: 14px;
            background: linear-gradient(135deg, #00ffcc, #00b894);
            border: none;
            color: #090618;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.3);
        }

        /* Карточки и магазин VPN */
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 320px;
            margin-bottom: 15px;
            text-align: left;
        }

        .card h3 { margin: 0 0 10px 0; color: #00ffcc; font-size: 18px; }
        .card p { margin: 5px 0; font-size: 14px; color: #b2bec3; }

        .vpn-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            width: 100%;
            max-width: 320px;
        }

        .buy-vpn-btn {
            background: linear-gradient(135deg, #ff007f, #7928ca);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(255, 0, 127, 0.4);
        }

        /* Нижнее меню */
        .nav-bar {
            width: 100%;
            background: rgba(9, 6, 24, 0.9);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            flex-shrink: 0;
        }

        .nav-item {
            background: none;
            border: none;
            color: #636e72;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: #00ffcc;
        }

        .nav-item span.icon {
            font-size: 20px;
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="header-bar">
        <div class="profile-container">
            <div class="avatar" id="user-avatar">👤</div>
            <span class="username" id="username">Игрок</span>
        </div>
    </div>

    <!-- ВКЛАДКА 1: КЛИКЕР -->
    <div id="tab-clicker" class="tab-content active">
        <div class="score-container" id="score">0.00</div>
        <div class="score-label">нафармлено секунд</div>

        <div class="clicker-area" id="clicker-area">
            <button class="tap-button" id="tap-btn">ТАП</button>
        </div>

        <button class="withdraw-btn" id="withdraw-btn">📤 Вывести в промокод</button>
    </div>

    <!-- ВКЛАДКА 2: ПРОФИЛЬ -->
    <div id="tab-profile" class="tab-content">
        <div class="card">
            <h3>📊 Статистика</h3>
            <p>Сила тапа: <b>+0.10 сек</b></p>
            <p>Всего кликов: <b id="p-clicks">0</b></p>
        </div>
        <div class="card">
            <h3>🆔 Аккаунт</h3>
            <p>Telegram ID: <b id="p-id">Не определен</b></p>
        </div>
    </div>

    <!-- ВКЛАДКА 3: МАГАЗИН VPN -->
    <div id="tab-vpn" class="tab-content">
        <div class="card" style="text-align: center; margin-bottom: 15px;">
            <h3>🛡️ Destok VPN</h3>
            <p style="font-size: 12px;">Быстрый и безопасный доступ в интернет</p>
        </div>

        <div class="vpn-item">
            <div style="text-align: left;">
                <strong>1 месяц</strong>
                <p style="margin:2px 0 0 0; font-size:11px; color:#00ffcc;">150 руб.</p>
            </div>
            <button class="buy-vpn-btn" onclick="buyVpn('1 месяц', 150)">Купить</button>
        </div>

        <div class="vpn-item">
            <div style="text-align: left;">
                <strong>3 месяца</strong>
                <p style="margin:2px 0 0 0; font-size:11px; color:#00ffcc;">400 руб. (-10%)</p>
            </div>
            <button class="buy-vpn-btn" onclick="buyVpn('3 месяца', 400)">Купить</button>
        </div>

        <div class="vpn-item">
            <div style="text-align: left;">
                <strong>1 год (Безлимит)</strong>
                <p style="margin:2px 0 0 0; font-size:11px; color:#00ffcc;">1200 руб. (-30%)</p>
            </div>
            <button class="buy-vpn-btn" onclick="buyVpn('1 год', 1200)">Купить</button>
        </div>
    </div>

    <!-- Нижняя навигация -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('clicker', this)">
            <span class="icon">⚡</span>Кликер
        </button>
        <button class="nav-item" onclick="switchTab('profile', this)">
            <span class="icon">👤</span>Профиль
        </button>
        <button class="nav-item" onclick="switchTab('vpn', this)">
            <span class="icon">🛡️</span>VPN
        </button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let score = parseFloat(localStorage.getItem('tc_score')) || 0.00;
        let totalClicks = parseInt(localStorage.getItem('tc_total_clicks')) || 0;

        const scoreElement = document.getElementById('score');
        const tapButton = document.getElementById('tap-btn');
        const clickerArea = document.getElementById('clicker-area');
        const withdrawBtn = document.getElementById('withdraw-btn');

        scoreElement.textContent = score.toFixed(2);

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('username').textContent = user.first_name;
            document.getElementById('p-id').textContent = user.id;
            if (user.photo_url) {
                document.getElementById('user-avatar').innerHTML = `<img src="${user.photo_url}">`;
            } else {
                document.getElementById('user-avatar').textContent = user.first_name.charAt(0);
            }
        }

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            document.getElementById('tab-' + tabName).classList.add('active');
            btnElement.classList.add('active');

            if (tabName === 'profile') {
                document.getElementById('p-clicks').textContent = totalClicks;
            }
        }

        tapButton.addEventListener('click', (event) => {
            score = Math.round((score + 0.10) * 100) / 100;
            totalClicks++;
            scoreElement.textContent = score.toFixed(2);

            saveData();

            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            createFloatingText(event, '+0.10с');
        });

        function createFloatingText(event, text) {
            const floatEl = document.createElement('div');
            floatEl.className = 'floating-text';
            floatEl.textContent = text;

            const rect = tapButton.getBoundingClientRect();
            floatEl.style.left = `${event.clientX - rect.left - 20}px`;
            floatEl.style.top = `${event.clientY - rect.top - 20}px`;

            clickerArea.appendChild(floatEl);
            setTimeout(() => floatEl.remove(), 700);
        }

        // Покупка VPN тарифа
        function buyVpn(tariffName, price) {
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                // Отправляем боту запрос на покупку конкретного тарифа
                tg.sendData(JSON.stringify({
                    action: "buy_vpn",
                    tariff: tariffName,
                    price: price,
                    user_id: tg.initDataUnsafe.user.id
                }));
            } else {
                alert(`[ТЕСТ БРАУЗЕРА] Запрос на покупку тарифа "${tariffName}" за ${price} руб.`);
            }
        }

        function saveData() {
            localStorage.setItem('tc_score', score);
            localStorage.setItem('tc_total_clicks', totalClicks);
        }

        function generatePromo() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = 'TIME';
            for (let i = 0; i < 8; i++) {
                if (i === 4) code += '-';
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        withdrawBtn.addEventListener('click', () => {
            if (score < 1.00) {
                alert("Минимум для вывода — 1.00 секунда!");
                return;
            }
            
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

            let promoCode = generatePromo();
            let withdrawnScore = score;

            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tg.sendData(JSON.stringify({
                    action: "create_promo",
                    code: promoCode,
                    amount: withdrawnScore,
                    user_id: tg.initDataUnsafe.user.id
                }));
            } else {
                alert(`[ТЕСТ] Выведено: ${withdrawnScore.toFixed(2)} сек.\nПромокод: ${promoCode}`);
            }

            score = 0.00;
            scoreElement.textContent = score.toFixed(2);
            saveData();
        });
    </script>
</body>
</html>
