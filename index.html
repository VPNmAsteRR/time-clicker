<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Destok VPN Кликер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #08090d;
            color: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% -20%, rgba(0, 242, 254, 0.12), transparent 40%);
        }
        .app-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 100px;
        }
        .screen { display: none; flex-direction: column; align-items: center; }
        .screen.active { display: flex; }
        .greeting { font-size: 22px; font-weight: 800; width: 100%; text-align: left; margin-bottom: 16px; }
        .balance-card {
            background: rgba(15, 20, 32, 0.85);
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 20px;
            padding: 16px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .balance-value {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .balance-value.bump { transform: scale(1.1); transition: transform 0.15s; }
        .info-card {
            background: rgba(20, 24, 35, 0.75);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 14px;
            width: 100%;
            margin-bottom: 12px;
        }
        .info-card .label { font-size: 11px; color: #6a6f7a; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-card .value { font-size: 14px; font-weight: 600; margin-top: 4px; word-break: break-all; }
        .info-card .value.active { color: #00f2fe; }
        .info-card .value.inactive { color: #ff3b30; }
        .info-card .value.warning { color: #ff9500; }
        .btn-secondary {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
        }
        .main-action-card {
            background: rgba(20, 24, 35, 0.75);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .clicker-container { position: relative; margin: 20px 0; display: flex; justify-content: center; align-items: center; }
        .clicker-glow {
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            filter: blur(30px);
            opacity: 0.4;
            animation: pulseGlow 2.5s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.3; }
            100% { transform: scale(1.2); opacity: 0.6; }
        }
        .clicker-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            z-index: 2;
            transition: transform 0.1s;
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.3);
        }
        .clicker-btn:active { transform: scale(0.92); }
        .clicker-btn span:first-child { font-size: 24px; font-weight: 900; color: #fff; }
        .clicker-btn span:last-child { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.8); margin-top: 2px; }
        .tariffs-list { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .tariff-card {
            background: rgba(20, 24, 35, 0.75);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .tariff-card.test { border-color: rgba(0, 242, 254, 0.3); }
        .tariff-info h4 { font-size: 15px; font-weight: 700; }
        .tariff-info p { font-size: 12px; color: #6a6f7a; margin-top: 2px; }
        .tariff-btn {
            background: rgba(0, 242, 254, 0.12);
            color: #00f2fe;
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 10px;
            padding: 8px 16px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }
        .nav-bar {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 380px;
            height: 64px;
            background: rgba(12, 16, 24, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 32px;
            display: flex;
            padding: 4px;
            z-index: 100;
        }
        .nav-item {
            flex: 1;
            background: transparent;
            border: none;
            color: #6a6f7a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            border-radius: 28px;
            transition: all 0.3s;
        }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
        .nav-item.active {
            background: rgba(0, 242, 254, 0.1);
            color: #fff;
        }
        .nav-item.active svg { fill: #00f2fe; }
        .floating-num {
            position: absolute;
            font-size: 20px;
            font-weight: 900;
            color: #fff;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.8);
            z-index: 10;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.7); }
            100% { opacity: 0; transform: translate(-50%, -120px) scale(1.1); }
        }
        .section-label {
            font-size: 11px;
            color: #6a6f7a;
            width: 100%;
            text-align: left;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- КЛИКЕР -->
    <div id="screen-clicker" class="screen active">
        <div class="greeting" id="greeting">Привет, друг! 👋</div>
        <div class="balance-card">
            <span style="font-size:22px;">⚡</span>
            <span class="balance-value" id="coinsDisplay">0.0 DC</span>
        </div>
        <div class="info-card">
            <div class="label">📌 Статус подписки</div>
            <div class="value" id="statusDisplay">Загрузка...</div>
        </div>
        <div class="info-card">
            <div class="label">🔗 Твоя ссылка</div>
            <div class="value" id="linkDisplay" style="font-size:12px;color:#00f2fe;">Загрузка...</div>
            <button class="btn-secondary" onclick="copyLink()">📋 Скопировать</button>
        </div>
        <div class="main-action-card">
            <span style="font-size:13px;color:#6a6f7a;font-weight:500;">Тапай по центру 👆</span>
            <div class="clicker-container">
                <div class="clicker-glow"></div>
                <div class="clicker-btn" id="clickerBtn">
                    <span>ТАП</span>
                    <span>+0.5 DC</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ТАРИФЫ -->
    <div id="screen-tariffs" class="screen">
        <div class="greeting">🛒 Магазин</div>
        <div class="section-label">Обмен Dcoin на VPN</div>
        <div class="tariffs-list">
            <div class="tariff-card test">
                <div class="tariff-info">
                    <h4>🧪 Тест 1 день</h4>
                    <p>10 Dcoin</p>
                </div>
                <button class="tariff-btn" onclick="buyTariff(10, 'TEST')">Купить</button>
            </div>
            <div class="tariff-card">
                <div class="tariff-info">
                    <h4>📅 3 дня</h4>
                    <p>1 000 Dcoin</p>
                </div>
                <button class="tariff-btn" onclick="buyTariff(1000, '3D')">Купить</button>
            </div>
            <div class="tariff-card">
                <div class="tariff-info">
                    <h4>📅 7 дней</h4>
                    <p>2 200 Dcoin</p>
                </div>
                <button class="tariff-btn" onclick="buyTariff(2200, '7D')">Купить</button>
            </div>
            <div class="tariff-card">
                <div class="tariff-info">
                    <h4>📅 30 дней</h4>
                    <p>7 500 Dcoin</p>
                </div>
                <button class="tariff-btn" onclick="buyTariff(7500, '30D')">Купить</button>
            </div>
        </div>
    </div>

</div>

<!-- НАВИГАЦИЯ -->
<nav class="nav-bar">
    <button class="nav-item active" onclick="switchTab('clicker', this)">
        <svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
        Кликер
    </button>
    <button class="nav-item" onclick="switchTab('tariffs', this)">
        <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
        Тарифы
    </button>
</nav>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const user = tg.initDataUnsafe?.user;
    const userId = user?.id || null;
    const firstName = user?.first_name || "друг";

    document.getElementById('greeting').textContent = `Привет, ${firstName}! 👋`;

    // ==================== API (HTTPS через Cloudflare) ====================
    const API_URL = 'https://lit-rejected-palm-decorative.trycloudflare.com';

    // ==================== ДАННЫЕ ====================
    let coins = parseFloat(localStorage.getItem('destok_coins')) || 0;
    let vpnLink = localStorage.getItem('destok_vpn_url') || 'Не куплена';
    let statusText = localStorage.getItem('destok_sub_status') || 'Загрузка...';

    const coinsEl = document.getElementById('coinsDisplay');
    const statusEl = document.getElementById('statusDisplay');
    const linkEl = document.getElementById('linkDisplay');
    const clickerBtn = document.getElementById('clickerBtn');

    // ==================== ЗАГРУЗКА ДАННЫХ ====================
    function loadData() {
        if (!userId) {
            statusText = '⚠️ Пользователь не определён';
            updateUI();
            return;
        }

        fetch(`${API_URL}/api/user?user_id=${userId}`)
            .then(res => {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            })
            .then(json => {
                if (json.success && json.data) {
                    const d = json.data;
                    if (d.coins !== undefined) {
                        coins = d.coins;
                        localStorage.setItem('destok_coins', coins);
                    }
                    if (d.sub_url && d.sub_url !== 'Не куплена') {
                        vpnLink = d.sub_url;
                        localStorage.setItem('destok_vpn_url', vpnLink);
                    }
                    if (d.is_active) {
                        statusText = `🟢 Активна до ${d.expire_date || 'скоро'}`;
                    } else if (d.is_banned) {
                        statusText = '⛔ Заблокирован';
                    } else {
                        statusText = '🔴 Не активна';
                    }
                    localStorage.setItem('destok_sub_status', statusText);
                    updateUI();
                }
            })
            .catch(err => {
                console.warn('API ошибка:', err);
                statusText = '⚠️ Ошибка загрузки';
                updateUI();
            });
    }

    function updateUI() {
        coinsEl.textContent = `${coins.toFixed(1)} DC`;
        linkEl.textContent = vpnLink;
        statusEl.textContent = statusText;
        statusEl.className = 'value';
        if (statusText.includes('🟢')) statusEl.classList.add('active');
        else if (statusText.includes('⛔')) statusEl.classList.add('inactive');
        else if (statusText.includes('⚠️')) statusEl.classList.add('warning');
        else if (!statusText.includes('Загрузка')) statusEl.classList.add('inactive');
    }

    // ==================== КЛИКЕР ====================
    clickerBtn.addEventListener('click', (e) => {
        coins += 0.5;
        localStorage.setItem('destok_coins', coins);
        updateUI();
        coinsEl.classList.add('bump');
        setTimeout(() => coinsEl.classList.remove('bump'), 200);
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

        const rect = clickerBtn.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const el = document.createElement('div');
        el.className = 'floating-num';
        el.textContent = '+0.5';
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        clickerBtn.appendChild(el);
        setTimeout(() => el.remove(), 800);

        if (userId && Math.floor(coins * 10) % 5 === 0) {
            fetch(`${API_URL}/api/coins/update`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, coins: coins })
            }).catch(() => {});
        }
    });

    // ==================== ПОКУПКА ====================
    function buyTariff(cost, code) {
        if (!userId) {
            alert('❌ Ошибка: пользователь не определён');
            return;
        }
        if (coins < cost) {
            alert('❌ Не хватает Dcoin! Тапай больше ⚡️');
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            return;
        }
        fetch(`${API_URL}/api/tariff/buy`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: userId, tariff: code, coins_spent: cost })
        })
        .then(res => res.json())
        .then(json => {
            if (json.success) {
                coins = json.new_balance;
                localStorage.setItem('destok_coins', coins);
                updateUI();
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                alert('✅ Заказ отправлен! Бот обработает его в ближайшее время.');
            } else {
                alert('❌ ' + (json.error || 'Ошибка'));
            }
        })
        .catch(() => {
            alert('❌ Ошибка соединения с сервером');
        });
    }

    // ==================== КОПИРОВАНИЕ ====================
    function copyLink() {
        if (!vpnLink || vpnLink === 'Не куплена' || vpnLink === 'Загрузка...') {
            alert('❌ Нет активной ссылки');
            return;
        }
        navigator.clipboard.writeText(vpnLink)
            .then(() => {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                alert('✅ Ссылка скопирована!');
            })
            .catch(() => {
                prompt('Скопируйте вручную:', vpnLink);
            });
    }

    // ==================== ПЕРЕКЛЮЧЕНИЕ ====================
    function switchTab(id, btn) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById('screen-' + id).classList.add('active');
        btn.classList.add('active');
        if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    }

    loadData();
</script>
</body>
</html>
